name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Game price stability regression tests
        run: python3 scripts/test_game_price_stability.py
      - name: Custom category deletion regression tests
        run: python3 scripts/test_custom_category_delete.py
      - name: Check public repository contents
        run: bash scripts/check-public-tree.sh
      - name: Create test configuration
        run: |
          cp .env.example .env
          sed -i 's/POSTGRES_PASSWORD=CHANGE_ME/POSTGRES_PASSWORD=ci-password/' .env
          sed -i 's/SECRET_KEY=CHANGE_ME/SECRET_KEY=ci-secret-only/' .env
          sed -i 's/ADMIN_PASSWORD=admin/ADMIN_PASSWORD=ci-admin-password/' .env
          sed -i 's/ADMIN_FORCE_PASSWORD_CHANGE=1/ADMIN_FORCE_PASSWORD_CHANGE=0/' .env
          printf '\nAPP_BIND=127.0.0.1\n' >> .env
      - name: Compile Python
        run: python3 -m py_compile app/app.py app/scheduler.py
      - name: Compile templates and route map
        run: python3 scripts/release_smoke.py && python3 scripts/test_logical_counts.py
      - name: Authenticated core-page smoke test
        env:
          DATABASE_URL: sqlite:////tmp/bibo-release-smoke.db
          ADMIN_USERNAME: smoke-admin
          ADMIN_PASSWORD: smoke-password
          SECRET_KEY: smoke-secret
        run: python3 scripts/integration_smoke.py
      - name: Validate Compose
        run: docker compose config -q
      - name: Build GameCollector
        run: docker compose build
      - name: Start database and web app
        run: docker compose up -d db web
      - name: Wait for deep healthcheck
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8095/health/deep && exit 0
            sleep 4
          done
          docker compose ps -a
          docker compose logs --no-color db web
          exit 1
      - name: Start scheduler
        run: |
          docker compose up -d scheduler
          test "$(docker inspect -f '{{.State.Status}}' gamecollector-scheduler-1)" = "running"
      - name: Stop containers
        if: always()
        run: docker compose down
