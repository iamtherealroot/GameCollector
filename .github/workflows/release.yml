name: Release archive

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version and public contents
        run: |
          bash scripts/check-public-tree.sh
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(python3 -c 'import ast,pathlib; tree=ast.parse(pathlib.Path("app/app.py").read_text()); print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=="APP_VERSION" for t in n.targets)))')"
          test "$tag_version" = "$app_version"
      - name: Build source archives
        run: |
          prefix="GameCollector-${GITHUB_REF_NAME#v}/"
          git archive --format=zip --prefix="$prefix" -o "GameCollector-${GITHUB_REF_NAME#v}-source.zip" HEAD
          git archive --format=tar.gz --prefix="$prefix" -o "GameCollector-${GITHUB_REF_NAME#v}-source.tar.gz" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GameCollector-*-source.zip
            GameCollector-*-source.tar.gz
