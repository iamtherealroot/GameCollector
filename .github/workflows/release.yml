name: Bibo release

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Verify public contents and version
        id: version
        run: |
          bash scripts/check-public-tree.sh
          version="$(python3 -c 'import ast,pathlib; tree=ast.parse(pathlib.Path("app/app.py").read_text()); print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=="APP_VERSION" for t in n.targets)))')"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi
          test -f "RELEASE-NOTES-v${version}.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build combined installation and update package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/test_game_price_stability.py
          bash scripts/build_release.sh "$RELEASE_VERSION" "$RUNNER_TEMP/bibo-release"
      - name: Publish release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving it."
            exit 0
          fi
          gh release create "$tag" \
            --target "$(git rev-parse HEAD)" \
            --title "Bibo $tag" \
            --notes-file "RELEASE-NOTES-${tag}.md" \
            "$RUNNER_TEMP/bibo-release/Bibo-${tag}.zip" \
            "$RUNNER_TEMP/bibo-release/Bibo-${tag}-SHA256SUMS.txt"
