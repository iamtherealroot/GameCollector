# Paste in Advanced for the Bibo proxy host only.
proxy_intercept_errors on;
error_page 502 503 504 /__bibo_unavailable.html;

location = /__bibo_unavailable.html {
    internal;
    alias /data/bibo-errors/bibo-unavailable.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
}
