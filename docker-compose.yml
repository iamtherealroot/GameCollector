services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamecollector}
      POSTGRES_USER: ${POSTGRES_USER:-gamecollector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gamecollector_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamecollector} -d ${POSTGRES_DB:-gamecollector}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gamecollector}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gamecollector}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BARCODE_LOOKUP_URL: ${BARCODE_LOOKUP_URL:-https://levelcomplete.de/api/public/search.php?{barcode}}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      PRICECHARTING_TOKEN: ${PRICECHARTING_TOKEN:-}
      VGPREISE_AUTH_CODE: ${VGPREISE_AUTH_CODE:-}
      TZ: ${TZ:-Europe/Berlin}
      AUTOMATIC_REVALUE_HOUR: ${AUTOMATIC_REVALUE_HOUR:-3}
    ports:
      - "${APP_PORT:-8095}:8000"
    volumes:
      - ./uploads:/app/app/static/uploads

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gamecollector}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gamecollector}
      SECRET_KEY: ${SECRET_KEY}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      PRICECHARTING_TOKEN: ${PRICECHARTING_TOKEN:-}
      VGPREISE_AUTH_CODE: ${VGPREISE_AUTH_CODE:-}
      TZ: ${TZ:-Europe/Berlin}
      AUTOMATIC_REVALUE_HOUR: ${AUTOMATIC_REVALUE_HOUR:-3}

volumes:
  gamecollector_db:
