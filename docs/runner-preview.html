<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bibo · Runner-Vorschau</title>
<link rel="stylesheet" href="../app/static/simple-ui.css">
<style>body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:#090e18;color:#eef3ff;font:16px system-ui}main{text-align:center;max-width:420px}h1{font-size:24px}p{color:#b5c1d8;line-height:1.6}.preview{display:flex;align-items:center;justify-content:center;gap:16px;background:#151f34;padding:24px;border:1px solid #35415c;border-radius:18px;margin:24px 0}.preview:focus{outline:2px solid #a7bdff}.preview:hover .bibo-loading-runner{animation-play-state:paused}</style></head>
<body><main><h1>Bibo-Moped</h1><div class="preview" tabindex="0"><span class="bibo-loading-runner" aria-hidden="true"></span><span>Seite wird geladen …</span></div><p>9 Fahrbilder · 1,26 Sekunden pro Schleife. Crash und Erholung: einmalig 4,02 Sekunden.</p><p>Zum Betrachten eines Einzelbilds die Maus über die Animation bewegen. Die Vorschau funktioniert auch ohne Internet. Bei aktivierter reduzierter Bewegung bleibt die Figur stehen.</p><button type="button" id="finish">Fertig – Crash und Erholung</button></main><script>const runner=document.querySelector(".bibo-loading-runner");document.querySelector("#finish").addEventListener("click",()=>{runner.classList.remove("is-finishing");void runner.offsetWidth;runner.classList.add("is-finishing");setTimeout(()=>runner.classList.remove("is-finishing"),4500);});</script></body></html>
