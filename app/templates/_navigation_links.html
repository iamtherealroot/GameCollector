{% for group in navigation_groups %}<details class="bibo-nav-group {{ 'is-active' if group.active }}" data-nav-group data-tour-group="{{ loop.index0 }}"><summary><span aria-hidden="true">{{ group.icon }}</span><span><strong>{{ group.title }}</strong><small>{{ group.description }}</small></span><span class="bibo-nav-chevron" aria-hidden="true">⌄</span></summary><div class="bibo-nav-links">{% for item in group['items'] %}<a href="{{ item.url }}" {{ 'aria-current=page' if item.active }} data-nav-link><span aria-hidden="true">{{ item.icon }}</span><span><strong>{{ item.title }}</strong><small>{{ item.description }}</small></span></a>{% endfor %}</div></details>{% endfor %}
