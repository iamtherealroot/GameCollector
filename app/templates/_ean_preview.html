<div class="ean-preview-grid">{% for row in previews %}<a class="ean-preview-card" href="{{ row.url }}">{% if row.cover_url %}<img src="{{ row.cover_url }}" alt="" loading="lazy" decoding="async">{% endif %}<div><span class="platform-pill">{{ row.category }}</span><h3>{{ row.title }}</h3><small>{{ row.source }}</small></div></a>{% else %}<p class="muted">Noch keine Vorschautreffer. Wähle eine Medienart für die gezielte Suche.</p>{% endfor %}</div>
